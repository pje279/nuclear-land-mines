[mod-setting-name]
nuclear-land-mines-debug-level=Current logging level
nuclear-land-mines-do-not-print=Do not print
nuclear-land-mines-do-traceback=Do function traceback

[mod-setting-description]
nuclear-land-mines-debug-level=Changing this will determine what level of debugging to enable.\nOdrder of precedence: Info > Debug > Warn > Error > None\n\nDefault of 'None'.
nuclear-land-mines-do-traceback=Changing this will enable traceback in the logging methods to help track down where the log was called from\n\nDefault of 'False'.